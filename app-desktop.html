// ─── WEBSOCKET HOOK ───────────────────────────────────────────────────────────
function useDesktopWS({ onInit, onPhoneConnected, onPhoneDisconnected, onLaunching, onDockSaved, onDockConfig }) {
  const wsRef = React.useRef(null);
  const [wsState, setWsState] = React.useState('disconnected');

  React.useEffect(() => {
    const room     = new URLSearchParams(window.location.search).get('room') || '';
    const proto    = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const portStr  = window.location.port ? `:${window.location.port}` : '';
    const origin   = `${window.location.hostname}${portStr}`;
    const query    = room ? `?room=${room}` : '';

    const connect = () => {
      const ws = new WebSocket(`${proto}://${origin}${query}`);
      wsRef.current = ws;
      ws.onopen = () => {
        setWsState('connected');
        ws.send(JSON.stringify({ type: 'register', role: 'desktop' }));
      };
      ws.onmessage = (e) => {
        let msg; try { msg = JSON.parse(e.data); } catch { return; }
        if (msg.type === 'init')               onInit?.(msg);
        if (msg.type === 'room_assigned')      { onInit?.(msg); } // no-room flow: treat like init
        if (msg.type === 'waiting_for_agent')  setWsState('waiting');
        if (msg.type === 'agent_reconnected')  onInit?.({ code: null, roomId: msg.roomId, paired: false });
        if (msg.type === 'phone_connected')    onPhoneConnected?.(msg);
        if (msg.type === 'phone_disconnected') onPhoneDisconnected?.(msg);
        if (msg.type === 'launching')          onLaunching?.(msg);
        if (msg.type === 'dock_saved')         onDockSaved?.(msg);
        if (msg.type === 'dock_config')        onDockConfig?.(msg);
      };
      ws.onclose = () => {
        setWsState('disconnected');
        wsRef.current = null;
        setTimeout(connect, 3000); // auto-reconnect
      };
      ws.onerror = () => setWsState('error');
    };
    connect();
    return () => wsRef.current?.close();
  }, []);

  const send = React.useCallback((msg) => {
    if (wsRef.current?.readyState === 1)
      wsRef.current.send(JSON.stringify(msg));
  }, []);

  return { wsState, send };
}

const RealIcon = ({ name, size = 56 }) => {

  if (isServed && !err) {
    return (
      <img
        src={`/icon/${encodeURIComponent(name)}${new URLSearchParams(window.location.search).get('room') ? '?room=' + new URLSearchParams(window.location.search).get('room') : ''}`}

    <div style={{

// ─── DOCK TAB ────────────────────────────────────────────────────────────────
const HARDCODED_APPS = [
  'Figma','VS Code','Chrome','Safari','Notion','Slack',
  'Spotify','Music','Mail','Calendar','Notes','Terminal',
  'Discord','Telegram','Xcode','Photoshop',
];

const DEFAULT_DOCK = ['Finder', 'Safari', 'Messages', 'Music', null, null, null, null];

const DockTab = ({ platform, onSaveDock, dockSyncedTick }) => {
  const [dockApps, setDockApps] = useState(DEFAULT_DOCK);
  const [installedApps, setInstalledApps] = useState([]);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('All');
  const [syncInstant, setSyncInstant] = useState(true);
  const [savedAnim, setSavedAnim] = useState(false);
  const [syncedAnim, setSyncedAnim] = useState(false);
  const font = platform === 'mac' ? FT.fontApple : FT.fontWin;
  const isServed = window.location.hostname !== '';

  // Fetch real installed apps from server on mount
  React.useEffect(() => {
    if (!isServed) return;
    const room = new URLSearchParams(window.location.search).get('room') || '';
    const url  = room ? `/apps?room=${room}` : '/apps';
    fetch(url)
      .then(r => r.json())
      .then(apps => setInstalledApps(apps.map(a => a.name)))
      .catch(() => {});
  }, []);

  // Show "Synced to phone" confirmation whenever the server acknowledges
  React.useEffect(() => {
    if (!dockSyncedTick) return;
    setSyncedAnim(true);
    const t = setTimeout(() => setSyncedAnim(false), 2000);
    return () => clearTimeout(t);
  }, [dockSyncedTick]);

  // Use fetched apps when available, else fall back to hardcoded list
  const availableApps = installedApps.length > 0 ? installedApps : HARDCODED_APPS;

  const filtered = availableApps.filter(name => {
    if (search && !name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const toggleApp = (appName) => {
    setDockApps(prev => {
      const idx = prev.indexOf(appName);
      if (idx !== -1) {
        // Already in dock → remove it
        const next = [...prev];
        next[idx] = null;
        return next;
      } else {
        // Not in dock → add to first empty slot
        const next = [...prev];
        const emptyIdx = next.indexOf(null);
        if (emptyIdx !== -1) {
          next[emptyIdx] = appName;
        } else {
          next.push(appName); // dock full, append
        }
        return next;
      }
    });
  };

  const handleSave = () => {
    setSavedAnim(true);
    setTimeout(() => setSavedAnim(false), 1500);
    // Send to WebSocket server if available; gracefully no-ops when disconnected
    onSaveDock?.(dockApps);
  };

  return (
    <div style={{ padding:20, display:'flex', flexDirection:'column', height:'100%', fontFamily:font, minHeight:0 }}>
      <div style={{ fontSize:16, fontWeight:700, color:'#1a1a1a', marginBottom:2 }}>Phone dock</div>
      <div style={{ fontSize:12, color:'rgba(0,0,0,0.5)', marginBottom:14 }}>Drag apps onto your phone's grid. Up to 8 per page.</div>

      <div style={{ flex:1, display:'flex', gap:16, minHeight:0 }}>
        {/* Left: available apps */}
        <div style={{ flex:'0 0 210px', display:'flex', flexDirection:'column', minHeight:0 }}>
          {/* Search */}
          <div style={{
            height:30, borderRadius: platform==='mac' ? 8 : 4,
            background:'rgba(0,0,0,0.05)',
            border: platform==='mac' ? '0.5px solid rgba(0,0,0,0.1)' : '1px solid rgba(0,0,0,0.15)',
            display:'flex', alignItems:'center', padding:'0 8px', gap:6,
            fontSize:12, color:'rgba(0,0,0,0.5)', marginBottom:8,
          }}>
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="rgba(0,0,0,0.4)" strokeWidth="1.5">
              <circle cx="4.5" cy="4.5" r="3.5"/><path d="M7 7 L 10 10"/>
            </svg>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search apps…"
              style={{ background:'none', border:'none', outline:'none', fontSize:12, fontFamily:font, flex:1, color:'#1a1a1a' }} />
          </div>
          {/* Filter pills */}
          <div style={{ display:'flex', gap:4, marginBottom:8 }}>
            {['All','Running','Recent'].map(f => (
              <div key={f} onClick={() => setFilter(f)} style={{
                padding:'3px 9px', borderRadius:999, fontSize:10, fontWeight:600, cursor:'pointer',
                background: f===filter ? '#1a1a1a' : 'rgba(0,0,0,0.06)',
                color: f===filter ? '#fff' : 'rgba(0,0,0,0.6)',
                transition:'all 0.15s',
              }}>{f}</div>
            ))}
          </div>
          {/* Grid */}
          <div style={{ flex:1, overflowY:'auto', display:'grid', gridTemplateColumns:'repeat(3, 60px)', gap:'4px 4px', alignContent:'start' }}>
            {filtered.map(appName => {
              const inDock = dockApps.includes(appName);
              return (
                <div key={appName} onClick={() => toggleApp(appName)} style={{
                  width:60, padding:'6px 4px', borderRadius:8, cursor:'pointer',
                  display:'flex', flexDirection:'column', alignItems:'center', gap:4,
                  background: inDock ? 'rgba(255,122,69,0.08)' : 'transparent',
                  transition:'all 0.15s',
                  outline: inDock ? `2px solid ${FT.accent}` : '2px solid transparent',
                  outlineOffset:'-1px',
                }}>
                  <RealIcon name={appName} size={42} />
                  <span style={{ fontFamily:font, fontSize:9, color:'rgba(0,0,0,0.65)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:52 }}>{appName}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Right: phone preview */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center' }}>
          <div style={{ fontFamily:font, fontSize:13, fontWeight:600, color:'rgba(0,0,0,0.7)', marginBottom:2, alignSelf:'flex-start' }}>Your phone dock</div>
          <MiniPhonePreview filled={dockApps} width={280} />
        </div>

  { icon:'💻', action:'Switch to Mac',       mac:'⌘1',   win:'Ctrl+1' },

  { icon:'🔲', action:'Toggle overlay',      mac:'⌘⇧O', win:'Ctrl+Shift+O' },
  { icon:'↻',  action:'Refresh connection',  mac:'⌘R',   win:'Ctrl+R' },
];

const HotkeysTab = ({ platform }) => {
  const [hotkeys, setHotkeys] = useState(HOTKEYS_INIT);
  const [editing, setEditing] = useState(null);
  const [editVal, setEditVal] = useState('');
  const font = platform === 'mac' ? FT.fontApple : FT.fontWin;

  const startEdit = (i) => {
    setEditing(i);
    setEditVal(platform === 'mac' ? hotkeys[i].mac : hotkeys[i].win);
  };

  const handleKeyDown = (e, i) => {
    e.preventDefault();
    const parts = [];
    if (e.ctrlKey || e.metaKey) parts.push(platform==='mac' ? '⌘' : 'Ctrl');
    if (e.altKey) parts.push(platform==='mac' ? '⌥' : 'Alt');
    if (e.shiftKey) parts.push(platform==='mac' ? '⇧' : 'Shift');
    const key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
    if (!['Control','Meta','Alt','Shift'].includes(e.key)) {
      parts.push(key);
      const combo = platform==='mac' ? parts.join('') : parts.join('+');
      setHotkeys(prev => prev.map((h,idx) => idx===i
        ? { ...h, [platform==='mac' ? 'mac' : 'win']: combo }
        : h
      ));
      setEditing(null);
    }
  };

  return (
    <div style={{ padding:24, fontFamily:font }}>
      <div style={{ fontSize:17, fontWeight:700, color:'#1a1a1a', marginBottom:4 }}>Keyboard shortcuts</div>
      <div style={{ fontSize:12, color:'rgba(0,0,0,0.5)', marginBottom:20 }}>Trigger any action from your computer keyboard.</div>
      <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
        {hotkeys.map((h, i) => (
          <div key={i} style={{
            display:'flex', alignItems:'center', gap:12, padding:'12px 0',
            borderBottom:'1px solid rgba(0,0,0,0.06)',
          }}>
            <span style={{ fontSize:18, width:28, textAlign:'center' }}>{h.icon}</span>
            <span style={{ flex:1, fontSize:13, fontWeight:500, color:'#1a1a1a' }}>{h.action}</span>
            {editing === i ? (
              <input autoFocus onKeyDown={e => handleKeyDown(e, i)}
                onChange={() => {}} value={editVal}
                placeholder="Press keys…"
                style={{
                  width:140, height:30, borderRadius: platform==='mac' ? 6 : 3,
                  border: `1.5px solid ${platform==='mac' ? FT.info : FT.winBlue}`,
                  fontFamily: platform==='mac' ? FT.fontMonoApple : FT.fontMonoWin,
                  fontSize:12, padding:'0 10px', outline:'none', background:'white',
                  boxShadow:`0 0 0 3px ${platform==='mac' ? 'rgba(0,122,255,0.15)' : 'rgba(0,103,184,0.15)'}`,
                }} />
            ) : (
              <div style={{
                padding:'4px 10px', borderRadius: platform==='mac' ? 6 : 3,
                background:'rgba(0,0,0,0.06)', border:'1px solid rgba(0,0,0,0.1)',
                fontFamily: platform==='mac' ? FT.fontMonoApple : FT.fontMonoWin,
                fontSize:12, fontWeight:600, color:'#1a1a1a',
                minWidth:80, textAlign:'center',
              }}>
                {platform==='mac' ? h.mac : h.win}
              </div>
            )}
            <button onClick={() => editing===i ? setEditing(null) : startEdit(i)} style={{
              height:28, padding:'0 10px', borderRadius: platform==='mac' ? 6 : 3,
              background: editing===i ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.05)',
              border:'1px solid rgba(0,0,0,0.1)', fontFamily:font, fontSize:12,
              fontWeight:500, color:'rgba(0,0,0,0.65)', cursor:'pointer',
            }}>{editing===i ? 'Cancel' : 'Edit'}</button>
          </div>
        ))}
      </div>
    </div>
  );
};

  <div style={{ display:'flex', gap:6, padding:'0 12px' }}>
    {['#FF5F57','#FEBC2E','#28C840'].map(c => (
      <div key={c} style={{ width:11, height:11, borderRadius:6, background:c, border:'0.5px solid rgba(0,0,0,0.1)' }} />
    ))}
  </div>
);

// ─── TAB CONTENT ROUTER ──────────────────────────────────────────────────────
const TabContent = ({ tab, platform, paired, setPaired, pairingCode, onRefresh, onSaveDock, dockSyncedTick }) => {
  switch (tab) {
    case 'Connection': return <ConnectionTab platform={platform} paired={paired} setPaired={setPaired} pairingCode={pairingCode} onRefresh={onRefresh} />;
    case 'Dock':       return <DockTab platform={platform} onSaveDock={onSaveDock} dockSyncedTick={dockSyncedTick} />;
    case 'Hotkeys':    return <HotkeysTab platform={platform} />;
    case 'Profiles':   return <ProfilesTab platform={platform} />;
    case 'Settings':   return <SettingsTab platform={platform} />;
    default:           return null;
  }
};

// ─── MAC APP WINDOW ──────────────────────────────────────────────────────────
const MacApp = ({ activeTab, setActiveTab, paired, setPaired, pairingCode, onRefresh, onSaveDock, dockSyncedTick }) => (
  <div style={{ display:'flex', flexDirection:'column', height:'100%', background:FT.macWall }}>
    <MacMenubar paired={paired} />
    <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:20, minHeight:0 }}>
      <div style={{
        width:'100%', maxWidth:860, height:'100%', maxHeight:560,
        borderRadius:12, overflow:'hidden',
        background:'rgba(255,255,255,0.75)',
        backdropFilter:'blur(40px) saturate(180%)',
        WebkitBackdropFilter:'blur(40px) saturate(180%)',
        boxShadow:'0 30px 60px rgba(0,0,0,0.22), 0 0 0 0.5px rgba(0,0,0,0.1)',
        display:'flex', flexDirection:'column',
      }}>
        {/* Title bar */}
        <div style={{
          height:30, display:'flex', alignItems:'center',
          borderBottom:'0.5px solid rgba(0,0,0,0.07)',
          background:'rgba(245,243,240,0.55)', flexShrink:0,
        }}>
          <MacTrafficLights />
          <div style={{ flex:1, textAlign:'center', fontSize:12, fontWeight:600, color:'rgba(0,0,0,0.65)' }}>
            FindInTosh — {activeTab}
          </div>
          <div style={{ width:88 }} />
        </div>
        {/* Body */}
        <div style={{ flex:1, display:'flex', overflow:'hidden', minHeight:0 }}>
          <MacSidebar activeTab={activeTab} setActiveTab={setActiveTab} paired={paired} />
          <div style={{ flex:1, overflowY:'auto', minWidth:0 }}>
            <TabContent tab={activeTab} platform="mac" paired={paired} setPaired={setPaired} pairingCode={pairingCode} onRefresh={onRefresh} onSaveDock={onSaveDock} dockSyncedTick={dockSyncedTick} />
          </div>
        </div>
      </div>
    </div>
  </div>
);

// ─── WINDOWS APP WINDOW ──────────────────────────────────────────────────────
const WinApp = ({ activeTab, setActiveTab, paired, setPaired, pairingCode, onRefresh, onSaveDock, dockSyncedTick }) => (
  <div style={{ display:'flex', flexDirection:'column', height:'100%', background:FT.winWall }}>
    <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:'16px 16px 4px', minHeight:0 }}>
      <div style={{
        width:'100%', maxWidth:860, height:'100%', maxHeight:560,
        borderRadius:8, overflow:'hidden',
        background:'#fff',
        boxShadow:'0 24px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.07)',
        display:'flex', flexDirection:'column',
      }}>
        {/* Win title bar */}
        <div style={{
          height:32, display:'flex', alignItems:'center', padding:'0 0 0 12px',
          fontFamily:FT.fontWin, fontSize:12, color:'#1a1a1a',
          borderBottom:'0.5px solid rgba(0,0,0,0.08)',
          background:'rgba(255,255,255,0.96)', flexShrink:0,
        }}>
          <div style={{ width:16, height:16, marginRight:8 }}>
            <IconFindInTosh size={16} radius={0.22} />
          </div>
          <span style={{ fontWeight:500 }}>FindInTosh</span>
          <div style={{ flex:1 }} />
          {[['—','hover:bg-gray'],['□','hover:bg-gray'],['×','close']].map(([g], i) => (
            <div key={i} style={{
              width:36, height:32, display:'flex', alignItems:'center', justifyContent:'center',
              fontSize: i===2 ? 14 : 11, cursor:'default',
              color:'#1a1a1a',
            }}>{g}</div>
          ))}
        </div>
        {/* Body */}
        <div style={{ flex:1, display:'flex', overflow:'hidden', minHeight:0 }}>
          <WinSidebar activeTab={activeTab} setActiveTab={setActiveTab} paired={paired} />
          <div style={{ flex:1, overflowY:'auto', minWidth:0 }}>
            <TabContent tab={activeTab} platform="win" paired={paired} setPaired={setPaired} pairingCode={pairingCode} onRefresh={onRefresh} onSaveDock={onSaveDock} dockSyncedTick={dockSyncedTick} />
          </div>
        </div>
      </div>
    </div>
    <WinTaskbar />
  </div>
);

// ─── ROOT APP ────────────────────────────────────────────────────────────────
const App = () => {
  const [platform, setPlatform] = useState('mac');
  const [activeTab, setActiveTab] = useState('Connection');
  const [paired, setPaired] = useState(false);
  const [pairingCode, setPairingCode] = useState(['–','–','–','–','–','–']); // shown before agent connects
  const [phonePaired, setPhonePaired] = useState(false);
  const [lastLaunch, setLastLaunch] = useState(null); // { app, appName, time }
  const [dockSyncedTick, setDockSyncedTick] = useState(0); // incremented on dock_saved

  const ws = useDesktopWS({
    onInit: (msg) => {
      setPairingCode(msg.code);
      setPhonePaired(msg.paired);
    },
    onPhoneConnected: () => setPhonePaired(true),
    onPhoneDisconnected: () => setPhonePaired(false),
    onLaunching: (msg) => {
      setLastLaunch({ app: msg.app, appName: msg.appName, time: Date.now() });
      setTimeout(() => setLastLaunch(null), 3000);
    },
    onDockSaved: () => setDockSyncedTick(t => t + 1),
    onDockConfig: () => {}, // no-op slot for future real-time dock updates from server
  });

  // Callback passed to DockTab — sends dock to server when WS is connected, silently skips when not
  const handleSaveDock = React.useCallback((apps) => {
    ws.send({ type: 'save_dock', apps });
  }, [ws.send]);

  // Merge WS paired state with local demo paired state
  const effectivePaired = paired || phonePaired;
  const setEffectivePaired = (val) => {
    setPaired(val);
    if (!val) setPhonePaired(false);
  };

  // Only show WS indicator when running from a real server (not file://)
  const isLive = typeof window !== 'undefined' && window.location.hostname !== '';

  // WS status pill colors/labels
  const wsIndicator = (() => {
    if (ws.wsState === 'connected' && effectivePaired) return { dot: '#34C759', label: 'Live' };
    if (ws.wsState === 'connected')                    return { dot: '#007AFF', label: 'En ligne' };
    if (ws.wsState === 'waiting')                      return { dot: '#FF9500', label: 'Attente agent…' };
    return { dot: '#8E8E93', label: 'Hors ligne' };
  })();

  return (
    <div style={{ width:'100vw', height:'100vh', position:'relative', overflow:'hidden' }}>
      {/* Platform toggle — top right corner, floating above everything */}
      <div style={{ position:'absolute', top:platform==='mac' ? 34 : 42, right:20, zIndex:100 }}>
        <PlatformToggle platform={platform} setPlatform={p => { setPlatform(p); setActiveTab('Connection'); }} />
      </div>

      {/* WS status indicator */}
      {isLive && (
        <div style={{
          position:'fixed', top:8, right:70, zIndex:9999,
          display:'flex', alignItems:'center', gap:5,
          padding:'3px 9px', borderRadius:999,
          background:'rgba(0,0,0,0.55)',
          backdropFilter:'blur(12px)',
          fontFamily:FT.fontApple, fontSize:11, fontWeight:600, color:'#fff',
          pointerEvents:'none',
        }}>
          <span style={{
            width:6, height:6, borderRadius:3,
            background: wsIndicator.dot,
            display:'inline-block',
            boxShadow: ws.wsState === 'connected' ? `0 0 0 0 ${wsIndicator.dot}` : 'none',
            animation: ws.wsState === 'connected' && effectivePaired ? 'ft-pulse-green 1.6s ease-out infinite' : 'none',
          }} />
          {wsIndicator.label}
        </div>
      )}

      {/* Launch toast */}
      {lastLaunch && (
        <div style={{
          position:'fixed', bottom:60, right:20, zIndex:9999,
          padding:'10px 16px', borderRadius:10,
          background:'rgba(28,28,32,0.95)',
          backdropFilter:'blur(20px)',
          border:'0.5px solid rgba(255,255,255,0.1)',
          boxShadow:'0 8px 32px rgba(0,0,0,0.4)',
          fontFamily:'-apple-system, system-ui', fontSize:13, color:'#fff',
          display:'flex', alignItems:'center', gap:10,
          animation:'ft-slide-up 0.22s cubic-bezier(0.2,0.8,0.2,1)',
        }}>
          <AppIcon id={lastLaunch.app} size={28} />
          <span>Launching <b>{lastLaunch.appName}</b></span>
        </div>
      )}

      {platform === 'mac'
        ? <MacApp activeTab={activeTab} setActiveTab={setActiveTab} paired={effectivePaired} setPaired={setEffectivePaired} pairingCode={pairingCode} onRefresh={() => ws.send({ type: 'refresh_code' })} onSaveDock={handleSaveDock} dockSyncedTick={dockSyncedTick} />
        : <WinApp activeTab={activeTab} setActiveTab={setActiveTab} paired={effectivePaired} setPaired={setEffectivePaired} pairingCode={pairingCode} onRefresh={() => ws.send({ type: 'refresh_code' })} onSaveDock={handleSaveDock} dockSyncedTick={dockSyncedTick} />
      }
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
