// ─── WEBSOCKET HOOK ──────────────────────────────────────────────────────────
function useWS() {
  const wsRef = React.useRef(null);
  const [wsState, setWsState] = React.useState('disconnected'); // 'connecting'|'connected'|'error'
  const listenersRef = React.useRef({});

  const connect = React.useCallback(() => {
    const room    = window._ftRoomId || new URLSearchParams(window.location.search).get('room') || '';
    const proto   = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const portStr = window.location.port ? `:${window.location.port}` : '';
    const origin  = `${window.location.hostname}${portStr}`;
    const query   = room ? `?room=${room}` : '';
    setWsState('connecting');
    const ws = new WebSocket(`${proto}://${origin}${query}`);
    wsRef.current = ws;
    ws.onopen = () => {
      setWsState('connected');
      if (room) ws.send(JSON.stringify({ type: 'register', role: 'phone' }));
      // no room → wait for user to enter pairing code → send find_and_pair
    };
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      const handler = listenersRef.current[msg.type];
      if (handler) handler(msg);
    };
    ws.onclose = () => {
      setWsState('disconnected');
      wsRef.current = null;
      setTimeout(() => connect(), 4000); // auto-reconnect
    };
    ws.onerror = () => setWsState('error');
  }, []);

  const send = React.useCallback((msg) => {
    if (wsRef.current && wsRef.current.readyState === 1)
      wsRef.current.send(JSON.stringify(msg));
  }, []);

  const on = React.useCallback((type, fn) => {
    listenersRef.current[type] = fn;
  }, []);

  return { wsState, connect, send, on };
}

// ─── SCREEN: PAIRING ─────────────────────────────────────────────────────────
const PairingScreen = ({ nav, ws }) => {
  const [code, setCode] = useState([]);
  const [connecting, setConnecting] = useState(false);
  const [error, setError] = useState(false);
  const [minutes, setMinutes] = useState(3);
  const [seconds, setSeconds] = useState(42);

  useEffect(() => {
    const t = setInterval(() => {
      setSeconds(s => {
        if (s === 0) {
          setMinutes(m => {
            if (m === 0) { clearInterval(t); return 0; }
            return m - 1;
          });
          return 59;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  // Register WS handlers (paired is handled at App level to capture dockApps)
  useEffect(() => {
    if (!ws) return;
    ws.on('pair_error', () => {
      setConnecting(false);
      setError(true);
      setTimeout(() => setError(false), 600);
    });
    ws.on('code_refreshed', () => nav('pairing'));
  }, []);

  useEffect(() => {
    const handler = (e) => {
      if (connecting) return;
      if (e.key === 'Backspace') {
        setCode(c => c.slice(0,-1));
      } else if (code.length < 6 && /^[a-zA-Z0-9]$/.test(e.key)) {
        setCode(c => [...c, e.key.toUpperCase()]);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [code, connecting]);

  const handleNumpad = (val) => {
    if (connecting) return;
    if (val === 'back') {
      setCode(c => c.slice(0,-1));
    } else if (val === 'check') {
      if (code.length === 6) {
        setConnecting(true);
        if (ws && ws.wsState === 'connected') {
          const hasRoom = !!new URLSearchParams(window.location.search).get('room');
          ws.send(hasRoom
            ? { type: 'pair',          code: code.join('') }
            : { type: 'find_and_pair', code: code.join('') }
          );
        } else {
          setTimeout(() => nav('connected'), 1500);
        }
      }
    } else if (code.length < 6) {
      setCode(c => [...c, val]);
    }
  };

  const cells = Array.from({length:6}).map((_,i) => ({
    char: code[i] || '',
    focused: i === code.length && !connecting,
    filled: i < code.length,
  }));

  const timeStr = `${minutes}:${String(seconds).padStart(2,'0')}`;
  const canSubmit = code.length === 6;

  return (
    <div className="screen-wrap" style={{
      position:'absolute', inset:0, background:FT.bgPhoneGradient,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      padding:'28px 24px',
    }}>
      {/* Logo + heading */}
      <div style={{marginBottom:12}}>
        <IconFindInTosh size={52} radius={0.24}/>
      </div>
      <div style={{fontFamily:FT.fontApple, fontSize:22, fontWeight:700, color:'#fff', letterSpacing:-0.3, textAlign:'center'}}>
        Pair with your computer
      </div>
      <div style={{fontFamily:FT.fontApple, fontSize:13, color:'rgba(255,255,255,0.55)', marginTop:4, textAlign:'center'}}>
        Enter the 6-character code shown on Mac or PC.
      </div>

      {/* Timer */}
      <div style={{
        marginTop:10, fontFamily:FT.fontMonoApple, fontSize:13, fontWeight:600,
        color: minutes === 0 && seconds < 30 ? FT.danger : 'rgba(255,255,255,0.5)',
      }}>
        {timeStr}
      </div>

      {/* Code cells */}
      <div style={{display:'flex', gap:8, marginTop:16}}>
        {cells.map((cell, i) => (
          <div key={i} style={{
            width:44, height:54, borderRadius:10,
            background: error ? 'rgba(255,59,48,0.12)' : connecting ? 'rgba(52,199,89,0.1)' : 'rgba(255,255,255,0.08)',
            border: error ? `2px solid ${FT.danger}` : connecting ? `2px solid ${FT.success}` : cell.focused ? `2px solid ${FT.accent}` : '0.5px solid rgba(255,255,255,0.12)',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontFamily:FT.fontMonoApple, fontSize:22, fontWeight:700, color: error ? FT.danger : '#fff',
            position:'relative', transition:'border-color 0.2s, background 0.2s, color 0.2s',
          }}>
            {cell.char}
            {cell.focused && !cell.char && !connecting && (
              <span style={{
                width:2, height:26, background:FT.accent, borderRadius:1,
                animation:'ft-blink 1s steps(1) infinite',
              }}/>
            )}
          </div>
        ))}
      </div>

      {/* Connecting spinner */}
      {connecting && !error && (
        <div style={{
          marginTop:12, display:'flex', alignItems:'center', gap:8,
          fontFamily:FT.fontApple, fontSize:13, color:FT.success, fontWeight:500,
        }}>
          <div style={{
            width:14, height:14, borderRadius:7,
            border:'2px solid rgba(52,199,89,0.3)',
            borderTop:'2px solid #34C759',
            animation:'ft-spin 0.8s linear infinite',
          }}/>
          Connecting…
        </div>
      )}

      {/* Error hint */}
      {error && (
        <div style={{
          marginTop:12, fontFamily:FT.fontApple, fontSize:13, color:FT.danger, fontWeight:500,
        }}>
          Wrong code — try again
        </div>
      )}

      {/* Hint */}
      {!connecting && !error && (
        <div style={{
          marginTop:10, fontFamily:FT.fontApple, fontSize:11,
          color:'rgba(255,255,255,0.45)', textAlign:'center',
        }}>
          Auto-fills from clipboard · <span style={{color:FT.accent, fontWeight:600, cursor:'pointer'}}>Scan QR code instead</span>
        </div>
      )}

      {/* Numpad */}
      <div style={{
        marginTop:20,
        display:'grid', gridTemplateColumns:'repeat(3, 60px)', gridTemplateRows:'repeat(4, 52px)',
        gap:8,

const GridScreen = ({ nav, apps = TAHOE_APPS, dockApps = null, showBack = false, backScreen = 'grid', title = null, ws }) => {
  const [tappedId, setTappedId] = useState(null);

  const useServerDock = dockApps !== null;
  const renderItems = useServerDock
    ? dockApps.slice(0, 8).map((appName, i) => ({ appName, _key: appName ? appName + i : 'empty-' + i }))
    : apps.slice(0, 8).map(app => ({ id: app.id, name: app.name, _key: app.id }));

  const handleIconTap = (idOrName) => {
    if (!idOrName) return;
    setTappedId(idOrName);
    setTimeout(() => setTappedId(null), 300);
    if (ws) ws.send({ type: 'launch', app: idOrName });
  };

  return (
    <div className="screen-wrap" style={{
      position:'absolute', inset:0,
      background:'radial-gradient(120% 100% at 30% 50%, #2a2a35 0%, #0a0a0c 60%)',

        {showBack ? (
          <div className="tap-target" onClick={() => nav(backScreen)} style={{
            width:32, height:32, borderRadius:10, background:'rgba(255,255,255,0.08)',
            display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          }}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M10 4 L 6 8 L 10 12"/>
            </svg>
          </div>
        ) : <div style={{width:32}}/>}
        {title && (
          <div style={{fontFamily:FT.fontApple, fontSize:15, fontWeight:600, color:'rgba(255,255,255,0.85)'}}>{title}</div>
        )}
        <div className="tap-target" onClick={() => nav('settings')} style={{
          width:32, height:32, borderRadius:10, background:'rgba(255,255,255,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" strokeWidth="1.5" strokeLinecap="round">
            <circle cx="8" cy="8" r="2"/>
            <path d="M8 1 V 3 M8 13 V 15 M1 8 H 3 M13 8 H 15"/>
            <path d="M3.2 3.2 L 4.6 4.6 M11.4 11.4 L 12.8 12.8"/>
            <path d="M12.8 3.2 L 11.4 4.6 M4.6 11.4 L 3.2 12.8"/>

        </div>
      </div>

      {/* Icons + right rail */}
      <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', position:'relative', paddingBottom:40}}>
        {/* 4×2 grid */}
        <div style={{
          display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gridTemplateRows:'repeat(2, 1fr)',
          gap:18, padding:'0 16px',
          flex:1,
        }}>
          {useServerDock
            ? renderItems.map(item => {
                const appName = item.appName;
                const iconSize = 72;
                return (
                  <div key={item._key} onClick={() => appName && handleIconTap(appName)} style={{
                    display:'flex', flexDirection:'column', alignItems:'center', gap:6,
                    transform: appName && tappedId === appName ? 'scale(0.92)' : 'scale(1)',
                    transition:'transform 120ms cubic-bezier(0.2,0.8,0.2,1)',
                  }}>
                    {appName
                      ? <RealIcon name={appName} size={iconSize}/>

                <div key={item._key} className={item.id ? 'icon-tap' : ''} onClick={() => handleIconTap(item.id)} style={{

                  {item.id ? (
                    <>

                      <span style={{fontFamily:FT.fontApple, fontSize:10, color:'rgba(255,255,255,0.75)', fontWeight:500, textAlign:'center'}}>{item.name}</span>

                    <div style={{width:72, height:72, borderRadius:16, background:'rgba(255,255,255,0.05)', border:'1px dashed rgba(255,255,255,0.1)'}}/>

                </div>

        </div>

        {/* Right rail */}
        <div style={{ display:'flex', flexDirection:'column', gap:10, paddingRight:12, flexShrink:0 }}>
          <RailTile selected={true} onClick={() => nav('mac-grid')}>

};

  </div>
);

// ─── ROOT APP ────────────────────────────────────────────────────────────────
// Initialize room ID from URL (or empty for /remote flow)
window._ftRoomId = new URLSearchParams(window.location.search).get('room') || '';

const App = () => {
  const hasRoom = !!window._ftRoomId;
  const [screen, setScreen] = useState(hasRoom ? 'welcome' : 'pairing');
  const [screenKey, setScreenKey] = useState(0);
  const ws = useWS();
  const [dockApps, setDockApps] = React.useState([
    'launchpad','finder','siri','compass',
    'music','messages','discord','telegram'
  ]); // default fallback
  const [dockUpdated, setDockUpdated] = React.useState(false);
  const dockUpdatedTimerRef = React.useRef(null);

  const nav = useCallback((to) => {
    setScreen(to);
    setScreenKey(k => k + 1);
  }, []);

  // Connect silently on mount
  useEffect(() => {
    ws.connect();
  }, []);

  // Handle code_refreshed at App level too (in case pairing screen isn't mounted)
  useEffect(() => {
    ws.on('code_refreshed', () => nav('pairing'));
  }, []);

  // Handle paired and dock_config messages at App level
  useEffect(() => {
    // phone reconnects to an already-paired room → skip re-entering code
    ws.on('ready', (msg) => {
      if (msg.paired) nav('connected');
    });
    ws.on('paired', (msg) => {
      if (msg.roomId) window._ftRoomId = msg.roomId;
      if (msg.dockApps && msg.dockApps.length) setDockApps(msg.dockApps);
      nav('connected');
    });
    ws.on('dock_config', (msg) => {
      if (msg.apps && msg.apps.length) {
        setDockApps(msg.apps);
        setDockUpdated(true);
        if (dockUpdatedTimerRef.current) clearTimeout(dockUpdatedTimerRef.current);
        dockUpdatedTimerRef.current = setTimeout(() => setDockUpdated(false), 2000);
      }
    });
  }, []);

  // WS status dot color
  const dotColor = ws.wsState === 'connected' ? '#34C759'
    : ws.wsState === 'connecting' ? '#FFB400'
    : '#FF3B30';

  const renderScreen = () => {
    switch (screen) {
      case 'welcome':     return <WelcomeScreen nav={nav}/>;
      case 'permissions': return <PermissionsScreen nav={nav}/>;
      case 'install':     return <InstallScreen nav={nav}/>;
      case 'pairing':     return <PairingScreen nav={nav} ws={ws}/>;
      case 'connected':   return <ConnectedScreen nav={nav}/>;
      case 'grid':        return <GridScreen nav={nav} dockApps={dockApps} ws={ws}/>;
      case 'mac-grid':    return <GridScreen nav={nav} apps={MAC_APPS} showBack backScreen="grid" title="Mac" ws={ws}/>;
      case 'win-grid':    return <GridScreen nav={nav} apps={WIN_APPS} showBack backScreen="grid" title="Windows" ws={ws}/>;
      case 'settings':    return <SettingsScreen nav={nav}/>;
      case 'offline':     return <OfflineScreen nav={nav}/>;
      default:            return <WelcomeScreen nav={nav}/>;
    }
  };

  return (
    <div style={{
      position:'fixed', inset:0, overflow:'hidden',
      background:'#0a0a0c',
      fontFamily:FT.fontApple,
    }}>
      <div key={screenKey} style={{position:'absolute', inset:0}}>
        {renderScreen()}
      </div>
      {/* WS status dot — hidden on welcome screen */}
      {screen !== 'welcome' && (
        <div style={{
          position:'fixed', top:14, right:14, zIndex:999,
          width:6, height:6, borderRadius:3,
          background: dotColor,
          boxShadow: `0 0 4px ${dotColor}`,
          transition: 'background 0.4s, box-shadow 0.4s',
        }}/>
      )}
      {/* Dock updated toast */}
      {dockUpdated && (
        <div style={{
          position:'fixed', bottom:40, left:'50%', transform:'translateX(-50%)',
          background:'rgba(52,199,89,0.9)', color:'#fff', padding:'8px 16px',
          borderRadius:20, fontSize:13, fontWeight:600, zIndex:999,
        }}>Dock updated from Mac</div>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
